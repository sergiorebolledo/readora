[package]
name = "readora"
version = "0.2.1"
description = "Readora: biblioteca de libros gratis para PC"
authors = ["Readora"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nombre distinto del binario para evitar choques al compilar en Windows.
name = "readora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Instalador más pequeño.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
